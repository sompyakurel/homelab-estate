# Home Assistant automations — fetched live from CT 106
# via the REST API (config ids from state attributes).
# Generated 2026-11-26; re-run fetch_ha_automations.py to refresh.
# NOTE: the front-door lock's Home Assistant device ID has been
# replaced with the placeholder YOUR_LOCK_DEVICE_ID (it is an
# HA-internal UUID, not a credential, but it identifies your lock).
# Find yours in HA: Settings -> Devices & services -> Devices ->
# your lock -> the ID is in the page URL. Substitute it above.

- id: driveway_early_warning
  alias: Driveway early warning
  description: Early heads-up when a person or car enters the driveway zone on the
    garage camera. Uses Frigate zone occupancy sensors (zone-only, reliable).
  triggers:
  - platform: state
    entity_id: binary_sensor.driveway_car_occupancy
    from: 'off'
    to: 'on'
  - platform: state
    entity_id: binary_sensor.driveway_person_occupancy
    from: 'off'
    to: 'on'
  actions:
  - target:
      entity_id: camera.garage
    data:
      filename: /config/www/garage_driveway.jpg
    action: camera.snapshot
  - data:
      title: Driveway alert
      message: '{% if trigger.entity_id == ''binary_sensor.driveway_car_occupancy''
        %}Car in driveway{% else %}Person in driveway{% endif %}'
      data:
        image: /local/garage_driveway.jpg
    action: notify.mobile_app_iphone
  - data:
      message: '{% if trigger.entity_id == ''binary_sensor.driveway_car_occupancy''
        %}A car just pulled into the driveway.{% else %}Someone is in the driveway.{%
        endif %}'
      target: media_player.bedroom_echo_dot
      data:
        type: announce
    action: notify.alexa_media
  mode: single
- id: '1795586762824'
  alias: Estate failure alert
  description: ''
  triggers:
  - trigger: template
    value_template: '{{ state_attr(''sensor.estate_briefing'', ''fails'') | length
      > 0 }}

      '
  conditions: []
  actions:
  - action: notify.alexa_media
    data:
      message: 'Attention. Failing now: {{ state_attr(''sensor.estate_briefing'',
        ''fails'') | join('', '') }}.'
      target: media_player.bedroom_echo_dot
      data:
        type: announce
  mode: single
- id: '1795471474533'
  alias: Garage motion announcement
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_garage_cam_motion
    from:
    - 'on'
  conditions: []
  actions:
  - action: notify.notify
    metadata: {}
    data:
      message: -Motion at the garage
      target: media_player.bedroom_echo_dot
      data:
        type: announce
  mode: single
- id: goodnight_check
  alias: Goodnight check
  description: At 22:00 the bedroom Dot says whether the front door is locked and
    whether the porch camera is on.
  triggers:
  - at: '22:00:00'
    trigger: time
  actions:
  - action: notify.alexa_media
    data:
      data:
        type: announce
      message: Good night. {% if is_state('lock.front_door', 'locked') %}The front
        door is locked.{% else %}The front door is unlocked.{% endif %} {% if states('camera.porch')
        not in ['unavailable', 'unknown'] %}The porch camera is on.{% else %}The porch
        camera is off.{% endif %}
      target: media_player.bedroom_echo_dot
  mode: single
- id: leaving_home_lock_action
  alias: Leaving-home lock action
  description: Tapping Lock now on the leaving-home warning locks the front door and
    confirms on the phone.
  triggers:
  - event_data:
      action: LOCK_DOOR
    event_type: mobile_app_notification_action
    trigger: event
  actions:
  - action: lock.lock
    data: {}
    target:
      entity_id: lock.front_door
  - action: notify.mobile_app_iphone
    data:
      message: Front door locked.
  mode: single
- id: leaving_home_warning
  alias: Leaving-home warning
  description: When Som's phone leaves home while the front door is unlocked, send
    a phone note with a Lock now button.
  triggers:
  - trigger: state
    entity_id: device_tracker.iphone
    from: home
    to: not_home
  - trigger: state
    entity_id: sensor.iphone_ssid
    for: 00:02:00
  conditions:
  - condition: state
    entity_id: lock.front_door
    state: unlocked
  - condition: template
    value_template: '{{ trigger.entity_id == ''device_tracker.iphone'' or (trigger.entity_id
      == ''sensor.iphone_ssid'' and trigger.from_state is not none and trigger.from_state.state
      in [''YOUR_HOME_SSID'', ''YOUR_HOME_SSID_EXT''] and trigger.to_state is not none and trigger.to_state.state
      not in [''YOUR_HOME_SSID'', ''YOUR_HOME_SSID_EXT'']) }}

      '
  actions:
  - action: notify.mobile_app_iphone
    data:
      data:
        actions:
        - action: LOCK_DOOR
          title: Lock now
      message: You're away and the front door is still unlocked.
  mode: single
- id: morning_briefing
  alias: Morning briefing
  description: Speaks the daily spoken morning briefing on the Echo Show 11 at 09:30,
    in parts (Alexa drops announcements over 1024 chars). A short delay between parts
    keeps them in order. Moved from the bedroom Echo Dot 2026-11-26 because the Dot
    moves to the porch.
  triggers:
  - at: 09:30:00
    trigger: time
  actions:
  - action: notify.alexa_media
    data:
      data:
        type: announce
      message: '{{ state_attr(''sensor.morning_briefing'', ''text'') }}'
      target: media_player.som_s_echo_show_11
  - if:
    - condition: template
      value_template: '{{ state_attr(''sensor.morning_briefing'', ''text2'') | default('''',
        true) | length > 0 }}'
    then:
    - delay: '{{ state_attr(''sensor.morning_briefing'', ''delay1'') | int(45) }}'
    - action: notify.alexa_media
      data:
        data:
          type: announce
        message: '{{ state_attr(''sensor.morning_briefing'', ''text2'') }}'
        target: media_player.som_s_echo_show_11
  - if:
    - condition: template
      value_template: '{{ state_attr(''sensor.morning_briefing'', ''text3'') | default('''',
        true) | length > 0 }}'
    then:
    - delay: '{{ state_attr(''sensor.morning_briefing'', ''delay2'') | int(45) }}'
    - action: notify.alexa_media
      data:
        data:
          type: announce
        message: '{{ state_attr(''sensor.morning_briefing'', ''text3'') }}'
        target: media_player.som_s_echo_show_11
  mode: single
- id: '1795585231862'
  alias: Morning estate briefing
