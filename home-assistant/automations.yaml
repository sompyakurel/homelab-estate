- id: '1795458074344'
  alias: New automation
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.porch_person_detection
    to:
    - 'on'
  conditions: []
  actions:
  - action: lock.unlock
    metadata: {}
    target:
      device_id: YOUR_LOCK_DEVICE_ID
    data: {}
  mode: single
- id: porch_digest
  alias: Porch daily digest
  description: At 23:00 the bedroom Dot reads today's porch tallies — named visitors
    (not Som), strangers, deliveries — sends the same summary to Som's phone, saves
    it to porch/digest/last, then resets them to zero.
  triggers:
  - at: '23:00:00'
    trigger: time
  actions:
  - action: notify.alexa_media
    data:
      data:
        type: announce
      message: '{% set v = states(''sensor.porch_digest_visitors'') | int(0) %}{%
        set s = states(''sensor.porch_digest_strangers'') | int(0) %}{% set d = states(''sensor.porch_digest_deliveries'')
        | int(0) %}{% if v == 0 and s == 0 and d == 0 %}Nothing to report from the
        porch today.{% else %}Porch digest. {{ v }} visitor{{ ''s'' if v != 1 else
        '''' }}, {{ s }} stranger{{ ''s'' if s != 1 else '''' }}, and {{ d }} {{ ''delivery''
        if d == 1 else ''deliveries'' }}.{% endif %}'
      target: media_player.bedroom_echo_dot
  - action: notify.mobile_app_iphone
    data:
      title: Porch digest
      message: '{% set v = states(''sensor.porch_digest_visitors'') | int(0) %}{%
        set s = states(''sensor.porch_digest_strangers'') | int(0) %}{% set d = states(''sensor.porch_digest_deliveries'')
        | int(0) %}{% if v == 0 and s == 0 and d == 0 %}Nothing to report from the
        porch today.{% else %}{{ v }} visitor{{ ''s'' if v != 1 else '''' }}, {{ s
        }} stranger{{ ''s'' if s != 1 else '''' }}, {{ d }} {{ ''delivery'' if d ==
        1 else ''deliveries'' }}.{% endif %}'
  - action: mqtt.publish
    data:
      payload: '{% set v = states(''sensor.porch_digest_visitors'') | int(0) %}{%
        set s = states(''sensor.porch_digest_strangers'') | int(0) %}{% set d = states(''sensor.porch_digest_deliveries'')
        | int(0) %}{% if v == 0 and s == 0 and d == 0 %}Nothing to report from the
        porch today.{% else %}Porch digest. {{ v }} visitor{{ ''s'' if v != 1 else
        '''' }}, {{ s }} stranger{{ ''s'' if s != 1 else '''' }}, and {{ d }} {{ ''delivery''
        if d == 1 else ''deliveries'' }}.{% endif %}'
      retain: true
      topic: porch/digest/last
  - action: mqtt.publish
    data:
      payload: '0'
      retain: true
      topic: porch/digest/visitors
  - action: mqtt.publish
    data:
      payload: '0'
      retain: true
      topic: porch/digest/strangers
  - action: mqtt.publish
    data:
      payload: '0'
      retain: true
      topic: porch/digest/deliveries
  mode: single
- id: '1795479858335'
  alias: Porch greeting
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/tracked_object_update
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''face'' and trigger.payload_json.camera
      == ''porch'' and trigger.payload_json.name in [''Som'', ''Mom'', ''Sami''] and
      trigger.payload_json.score > 0.7 }}

      '
  - condition: time
    after: 07:00:00
    before: '22:00:00'
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  actions:
  - action: notify.alexa_media
    data:
      message: Namaste, welcome home, {{ trigger.payload_json.name }}
      target: media_player.som_s_echo_show_11
      data:
        type: announce
  - if:
    - condition: template
      value_template: '{{ trigger.payload_json.name != ''Som'' }}'
    then:
    - action: mqtt.publish
      data:
        topic: porch/digest/visitors
        retain: true
        payload: '{{ states(''sensor.porch_digest_visitors'') | int(0) + 1 }}'
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  mode: single
- id: '1795492300318'
  alias: Porch package note
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/events
  - trigger: state
    entity_id: sensor.porch_porch_packages_classification
    to: package_present
    for: 00:00:20
    from: clear
  conditions:
  - condition: template
    value_template: '{{ (trigger.platform == ''mqtt'' and trigger.payload_json.type
      == ''end'' and trigger.payload_json.after.camera == ''porch'' and trigger.payload_json.after.label
      == ''person'' and (trigger.payload_json.after.sub_label is none or trigger.payload_json.after.sub_label
      | length == 0) and (trigger.payload_json.after.end_time - trigger.payload_json.after.start_time)
      >= 20 and (trigger.payload_json.after.end_time - trigger.payload_json.after.start_time)
      <= 180 and ''approach'' in trigger.payload_json.after.entered_zones) or (trigger.platform
      == ''state'' and trigger.to_state.state == ''package_present'') }}

      '
  actions:
  - if:
    - condition: time
      after: 07:00:00
      before: '21:00:00'
      weekday:
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
    then:
    - action: notify.alexa_media
      data:
        message: Here goes my wallet again.
        target: media_player.bedroom_echo_dot
        data:
          type: announce
  - action: camera.snapshot
    metadata: {}
    target:
      entity_id: camera.porch
    data:
      filename: /config/www/porch_doorstep.jpg
  - action: notify.mobile_app_iphone
    data:
      title: Package may have been left
      message: An unrecognised visitor came and left quickly — check the porch for
        a delivery.
      data:
        image: /local/porch_doorstep.jpg
  - action: mqtt.publish
    data:
      topic: porch/digest/deliveries
      retain: true
      payload: '{{ states(''sensor.porch_digest_deliveries'') | int(0) + 1 }}'
  - delay: 00:02:00
  mode: single
- id: porch_receptionist_reply
  alias: Porch receptionist reply
  description: Speak the AI receptionist reply from CT 105 via Alexa.
  triggers:
  - trigger: mqtt
    options:
      topic: porch/receptionist/reply
  conditions: []
  actions:
  - action: notify.alexa_media
    data:
      message: '{{ trigger.payload }}'
      target: media_player.som_s_echo_show_11
      data:
        type: announce
  mode: single
- id: porch_receptionist_start
  alias: Porch receptionist start
  description: 'Stranger at the porch: speak the opener and start the AI receptionist
    service on CT 105.'
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''end'' and trigger.payload_json.after.camera
      == ''porch'' and trigger.payload_json.after.label == ''person'' and (trigger.payload_json.after.sub_label
      is none or trigger.payload_json.after.sub_label | length == 0) and ''approach''
      in trigger.payload_json.after.entered_zones and states(''sensor.porch_porch_packages_classification'')
      != ''package_present'' and (states.lock.front_door.last_changed is none or (now()
      - states.lock.front_door.last_changed).total_seconds() > 180) and trigger.payload_json.after.entered_zones[0]
      != ''doorstep'' }}'
  - condition: time
    after: 07:00:00
    before: '22:00:00'
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  actions:
  - action: notify.alexa_media
    data:
      message: Sorry, I do not recognise you. How can I help you?
      target: media_player.som_s_echo_show_11
      data:
        type: announce
  - action: mqtt.publish
    data:
      topic: porch/receptionist/start
      payload: start
  mode: single
- id: '1795482933697'
  alias: Porch unknown person
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''end'' and trigger.payload_json.after.camera
      == ''porch'' and trigger.payload_json.after.label == ''person'' and (trigger.payload_json.after.sub_label
      is none or trigger.payload_json.after.sub_label | length == 0) and ''approach''
      in trigger.payload_json.after.entered_zones and states(''sensor.porch_porch_packages_classification'')
      != ''package_present'' and (states.lock.front_door.last_changed is none or (now()
      - states.lock.front_door.last_changed).total_seconds() > 180) and trigger.payload_json.after.entered_zones[0]
      != ''doorstep'' }}'
  actions:
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
      weekday:
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
    then:
    - delay: 00:00:15
    - if:
      - condition: template
        value_template: '{{ states.automation.porch_greeting.attributes.last_triggered
          is none or (now() - states.automation.porch_greeting.attributes.last_triggered).total_seconds()
          > 90 }}'
      then:
      - action: notify.alexa_media
        data:
          message: You might be looking at the wrong house. Stranger dtetected
          target: media_player.bedroom_echo_dot
          data:
            type: announce
  - action: camera.snapshot
    metadata: {}
    target:
      entity_id: camera.porch
    data:
      filename: /config/www/porch_unknown.jpg
  - action: notify.mobile_app_iphone
    data:
      title: Unknown person at the porch
      message: Someone Frigate doesn't recognise was at the porch camera.
      data:
        image: /local/porch_unknown.jpg
  - action: mqtt.publish
    data:
      topic: porch/digest/strangers
      retain: true
      payload: '{{ states(''sensor.porch_digest_strangers'') | int(0) + 1 }}'
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  mode: single
- id: '1795481442991'
  alias: porch unlock
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/tracked_object_update
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''face'' and trigger.payload_json.camera
      == ''porch'' and trigger.payload_json.name in [''Som'', ''Mom'', ''Sami''] and
      trigger.payload_json.score > 0.7 }}

      '
  - condition: lock.is_locked
    target:
      device_id: YOUR_LOCK_DEVICE_ID
    options:
      behavior: any
      for: 00:00:00
  actions:
  - action: lock.unlock
    metadata: {}
    target:
      device_id: YOUR_LOCK_DEVICE_ID
    data: {}
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  mode: single
